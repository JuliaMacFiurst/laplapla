<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8ef" />
    <meta name="robots" content="noindex, nofollow" />
    <title>LapLapLa — нет подключения</title>
    <style>
      @font-face {
        font-family: "Amatic SC";
        src: url("/fonts/AmaticSC-Bold.ttf") format("truetype");
        font-style: normal;
        font-weight: 700;
        font-display: swap;
      }
      :root { color-scheme: light; font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 15%, #fff0f6 0 10%, transparent 32%),
          radial-gradient(circle at 80% 80%, #e8f8ff 0 9%, transparent 31%),
          #fff;
        color: #302940;
        text-align: center;
      }
      main { width: min(100%, 560px); }
      .logo {
        width: clamp(132px, 34vw, 210px);
        height: auto;
        margin-bottom: 10px;
        object-fit: contain;
      }
      .offline-title {
        margin: 0 0 12px;
        font-family: "Amatic SC", cursive;
        font-size: clamp(1.75rem, 6vw, 2.65rem);
        font-weight: 700;
        line-height: 1.08;
      }
      p { margin: 0 auto 24px; max-width: 470px; font-size: clamp(1rem, 3.6vw, 1.2rem); line-height: 1.55; }
      button {
        min-width: 210px;
        min-height: 52px;
        padding: 12px 24px;
        border: 1px solid rgba(255, 255, 255, 0.92);
        border-radius: 9999px;
        background: linear-gradient(135deg, #fb7185, #f59e0b);
        color: #fff;
        font: 700 1.08rem inherit;
        box-shadow:
          inset 0 10px 0 rgba(255, 255, 255, 0.4),
          0 10px 20px rgba(148, 163, 184, 0.16),
          0 4px 0 rgba(255, 255, 255, 0.55);
        cursor: pointer;
        transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
      }
      button:hover {
        transform: translateY(-2px) scale(1.02);
        filter: brightness(1.04) saturate(1.03);
        box-shadow:
          0 14px 28px rgba(148, 163, 184, 0.18),
          inset 0 10px 0 rgba(255, 255, 255, 0.32);
      }
      button:active {
        transform: translateY(1px) scale(0.97);
        box-shadow:
          0 6px 14px rgba(148, 163, 184, 0.12),
          inset 0 8px 16px rgba(255, 255, 255, 0.18);
      }
      button:focus-visible { outline: 3px solid #5d4a78; outline-offset: 4px; }
      button[disabled],
      button[disabled]:hover,
      button[disabled]:active {
        opacity: .72;
        cursor: wait;
        filter: none;
        transform: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/laplapla-logo.webp" alt="LapLapLa" width="210" height="210" />
      <h1 class="offline-title" id="offline-title">Сейчас нет подключения к Интернету</h1>
      <p id="offline-message">
        Большинство функций LapLapLa используют онлайн-сервисы. Подключитесь к Интернету и
        попробуйте ещё раз.
      </p>
      <button id="retry" type="button">Повторить попытку</button>
    </main>
    <script>
      (() => {
        const copy = {
          ru: {
            title: "Сейчас нет подключения к Интернету",
            message: "Большинство функций LapLapLa используют онлайн-сервисы. Подключитесь к Интернету и попробуйте ещё раз.",
            retry: "Повторить попытку",
            checking: "Проверяем…"
          },
          en: {
            title: "There is no Internet connection",
            message: "Most LapLapLa features use online services. Connect to the Internet and try again.",
            retry: "Try again",
            checking: "Checking…"
          },
          he: {
            title: "אין כרגע חיבור לאינטרנט",
            message: "רוב התכונות של LapLapLa משתמשות בשירותים מקוונים. התחברו לאינטרנט ונסו שוב.",
            retry: "ניסיון נוסף",
            checking: "בודקים…"
          }
        };
        const language = (navigator.language || "ru").toLowerCase().split("-")[0];
        const lang = Object.prototype.hasOwnProperty.call(copy, language) ? language : "en";
        const text = copy[lang];
        const button = document.getElementById("retry");
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
        document.getElementById("offline-title").textContent = text.title;
        document.getElementById("offline-message").textContent = text.message;
        button.textContent = text.retry;
        const retry = () => {
          button.disabled = true;
          button.textContent = text.checking;
          window.location.reload();
          window.setTimeout(() => {
            button.disabled = false;
            button.textContent = text.retry;
          }, 2500);
        };
        button.addEventListener("click", retry);
        window.addEventListener("online", retry, { once: true });
      })();
    </script>
  </body>
</html>
